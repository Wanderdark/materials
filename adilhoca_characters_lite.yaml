version: "1.0-lite"
title: "ADILHOCA CHARACTERS LITE"
purpose: "Compact DALL-e character consistency reference for the canonical AdilHoca student roster."

canonical_rules:
  signature_activities_are_locked: true
  rule: "A student's signature activity always belongs to that canonical student. Never assign another student's signature activity unless explicitly requested."
  age_appropriate_action_rule: "Every canonical child character must behave in ways that are realistic for their age. Activities involving legal responsibility, financial transactions, hotel reservations, driving, or other adult-only actions should be performed by an accompanying adult whenever appropriate. Children may observe, assist, or participate naturally, but should not replace adults in age-inappropriate situations."
  child_age_lock:
    canonical_age_source: "Use each student's age field. The current canonical roster uses age 12."
    template: "[NAME] is a [CANONICAL AGE]-year-old [girl/boy]. Do not make [him/her] look older or younger. Preserve [his/her] canonical child age, body proportions and overall youthful appearance."

signature_activity_index:
  pet_care: Ava
  swimming: Benjamin
  dancing: Chloe
  electric_scooter: Daniel
  family_holidays: David
  singing: Ella
  helping_others: Emma
  golf: Ethan
  cycling: Hannah
  fishing: Jack
  football: Lucas
  diary: Mia
  studying: Noah
  photography: Olivia
  coding: Victoria
  crossword_puzzles: Zoe

style_lock:
  style: "Premium casual educational game asset, stylized illustration, child-friendly, smooth rounded shapes, soft shading, clean outlines, vibrant colors, highly readable composition, isolated on a pure white background unless a scene background is requested, no text, no logo, production-ready educational asset, high detail."
  consistency_rule: "This is the SAME canonical student from the AdilHoca educational universe. Preserve the face shape, hairstyle, hair length, hair color, eye color, glasses status, age, body proportions, skin tone, and overall facial identity exactly. Only clothing, pose, action, environment, and facial expression may change when requested."

relative_height_system:
  note: "Relative visual proportions only, never exact centimeters. Use subtly unless the scene teaches tall / short comparisons."
  scale:
    5: "tallest students"
    4: "above average height"
    3: "average height"
    2: "short"
    1: "shortest students"

