relative_height_system:
  purpose: "Define consistent relative height differences between canonical AdilHoca students for visual comparison scenes such as tall / short, taller than, shorter than, and other comparative adjective lessons."
  fixed_centimeter_values: false
  note: "These are relative visual proportions. Characters grow older across grades, but their relative height ranking should remain consistent."
  scale:
    5: "tallest students"
    4: "above average height"
    3: "average height"
    2: "short"
    1: "shortest students"
  usage_rules:
    - "Use this system only for relative visual consistency."
    - "Do not mention exact height in centimeters."
    - "Do not exaggerate height differences unrealistically."
    - "All students are still middle school children, so differences should look natural."
    - "Keep body type neutral and age-appropriate."
    - "Do not use height to imply strength, beauty, intelligence, popularity, or personality value."
    - "When a scene is not about height or comparison, keep height differences subtle and natural."
    - "Character identity rules still have priority: face, hairstyle, hair color, eye color, eyeglasses, skin tone, and recognizable silhouette must remain consistent."
