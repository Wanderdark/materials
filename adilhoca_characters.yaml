title: "ADILHOCA CHARACTERS"
purpose: "AI-ready character cards for the canonical AdilHoca student roster."
important_rule: "These cards define permanent physical identity. In normal lesson images, do not change the student's face, age, hair, eye color, glasses status, body proportions, or overall identity. Clothing, pose, activity, background, and expression may change unless the lesson specifically teaches physical appearance."

canonical_rules:
  signature_activities_are_locked: true
  rule: "A student's signature activity always belongs to that canonical student. Never assign another student's signature activity unless explicitly requested."
  age_appropriate_action_rule: "Every canonical child character must behave in ways that are realistic for their age. Activities involving legal responsibility, financial transactions, hotel reservations, driving, or other adult-only actions should be performed by an accompanying adult whenever appropriate. Children may observe, assist, or participate naturally, but should not replace adults in age-inappropriate situations."
  child_age_lock:
    canonical_age_source: "Use each student's age field. The current canonical roster uses age 12."
    template: "[NAME] is a [CANONICAL AGE]-year-old [girl/boy]. Do not make [him/her] look older or younger. Preserve [his/her] canonical child age, body proportions and overall youthful appearance."
  parent_identity_rules:
    parents_are_canonical_supporting_characters: true
    rule: "Parents must not be generated as generic adults. Each parent has a distinct visual identity and should remain recognizable across family scenes. Parent identity should be included in prompts whenever a parent appears."
    family_resemblance_rule: "Parent visual identities should share believable DNA cues with the child. Preserve each parent's distinct identity while echoing the child's canonical features through hair texture, eye shape, smile, face shape, eyebrow shape, skin tone family, or overall facial softness."

